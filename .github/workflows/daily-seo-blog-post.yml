name: Daily SEO Blog Post

on:
  schedule:
    - cron: '0 7 * * *'     # Svaki dan u 09:00 CEST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-blog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate SEO Blog Post with Grok
        id: generate
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
        run: |
          set -euo pipefail

          PUB_DATE=$(date -u +"%Y-%m-%d")

          curl -s -X POST "https://api.x.ai/v1/chat/completions" \
            -H "Authorization: Bearer ${GROK_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "grok-4-1-fast-non-reasoning",
              "temperature": 0.7,
              "messages": [
                {
                  "role": "user",
                  "content": "You are a world-class SEO content writer for freelancers and small businesses.\n\nWrite ONE complete, high-value blog post in Markdown format.\n\nUse this EXACT frontmatter (do not change the order or keys):\n\n---\nslug: \"kebab-case-from-title\"\ntitle: \"SEO-optimized title with long-tail keyword (55-65 chars)\"\ndescription: \"145-160 character compelling meta description with keyword and benefit\"\npubDate: \"'${PUB_DATE}'\"\nupdatedDate: \"'${PUB_DATE}'\"\ntags: [\"invoice-reminders\", \"cash-flow\", \"freelance-finance\"]\nseoKeywords:\n  - \"primary long tail keyword\"\n  - \"secondary long tail keyword\"\n  - \"tertiary long tail keyword\"\ndraft: false\nheroImage: \"/blog/images/placeholder.jpg\"\ncanonicalURL: \"https://chaseai.app/blog/slug/\"\nreadingTime: 10\n---\n\nRequirements:\n- Length: 1400-2000 words\n- Very helpful and practical\n- Use H2, H3, bullet lists, examples, templates\n- Include internal links to existing pages when natural\n- Strong SEO with long-tail keywords\n- Natural CTA for ChaseAI at the end\n- Never repeat the same main topic from the last 14 days\n\nReturn ONLY the full Markdown file (frontmatter + content). No explanations."
                }
              ]
            }' | jq -r '.choices[0].message.content' > blog-post.mdx

      - name: Create MDX file and commit
        run: |
          set -euo pipefail

          mkdir -p marketing/src/content/blog

          # Extract slug from frontmatter
          SLUG=$(grep '^slug:' blog-post.mdx | head -1 | sed 's/^slug: "\(.*\)"/\1/')

          FILENAME="marketing/src/content/blog/${SLUG}.mdx"

          mv blog-post.mdx "$FILENAME"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "$FILENAME"
          git commit -m "feat(blog): daily SEO post - ${SLUG} (${{ github.run_id }})" || echo "No changes to commit"
          git push
name: Daily SEO Blog Post

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Blog Post with Grok
        id: generate
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
        run: |
          PUB_DATE=$(date -u +"%Y-%m-%d")

          curl -s -X POST "https://api.x.ai/v1/chat/completions" \
            -H "Authorization: Bearer ${GROK_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "grok-4-1-fast-non-reasoning",
              "temperature": 0.6,
              "messages": [
                {
                  "role": "user",
                  "content": "You are a world-class SEO writer. Write ONE complete blog post.\n\nRETURN ONLY CLEAN MARKDOWN. No explanations, no ```markdown, no code fences, no extra text.\n\nUse EXACTLY this frontmatter and nothing else:\n\n---\nslug: \"kebab-case-slug-from-title\"\ntitle: \"Title must be 70 characters or fewer\"\ndescription: \"Exactly 140-160 characters long. Must include main keyword and benefit.\"\npubDate: \"'${PUB_DATE}'\"\nupdatedDate: \"'${PUB_DATE}'\"\ntags: [\"invoice-reminders\", \"cash-flow\", \"freelance-finance\"]\nseoKeywords:\n  - \"long-tail-keyword-1\"\n  - \"long-tail-keyword-2\"\n  - \"long-tail-keyword-3\"\ndraft: false\nheroImage: \"/blog/images/placeholder.jpg\"\ncanonicalURL: \"https://chaseai.app/blog/slug/\"\nreadingTime: 10\n---\n\nWrite 1400-2000 words of high-value, practical content. Use H2, H3, lists, examples.\nNever repeat topics. Return ONLY the Markdown file."
                }
              ]
            }' | jq -r '.choices[0].message.content' > raw.mdx

          # Čišćenje outputa od Groka
          sed -E '/^```/d' raw.mdx > clean.mdx

      - name: Create MDX file
        run: |
          mkdir -p marketing/src/content/blog

          SLUG=$(grep '^slug:' clean.mdx | head -1 | sed 's/^slug: "\(.*\)"/\1/')
          FILENAME="marketing/src/content/blog/${SLUG}.mdx"

          mv clean.mdx "$FILENAME"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FILENAME"
          git commit -m "feat(blog): daily SEO post - ${SLUG}" || echo "No changes"
          git push
